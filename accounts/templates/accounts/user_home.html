{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panel Usuario</title>

    <link
        rel="stylesheet"
        href="{% static 'accounts/css/panel_usuario.css' %}"
    >
</head>

<body>

    <main class="panel-container">

        <section class="panel-card">

            <h1>Panel Usuario</h1>

            <p class="bienvenida">
                Bienvenido
                <strong>{{ request.user.username }}</strong>
            </p>

            <p class="descripcion">
                Selecciona la sección que deseas utilizar.
            </p>

            <div class="panel-secciones">

                <a
                    href="{% url 'accounts:aplicaciones_home' 'cartografia' %}"
                    class="seccion-card"
                >

                                        
                    <span class="btn">
                        CARTOGRAFIA
                    </span>

                </a>
                   
                <a
                    href="{% url 'accounts:aplicaciones_home' 'electromovilidad' %}"
                    class="seccion-card"
                >
                               
                    <span class="btn">
                        ELECTROMOVILIDAD
                    </span>

                </a>

                <a
                    href="https://georeferenciacion-chatbot.streamlit.app/"
                    class="seccion-card"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span class="btn">
                        CHATBOT
                    </span>
                </a>

            </div>


            <div class="panel-opciones">

                <a
                    href="/logout/"
                    class="btn btn-logout"
                >
                    Cerrar sesión
                </a>

            </div>

        </section>

    </main>

</body>

</html>

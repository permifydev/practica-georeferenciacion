{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión | ADDRSS</title>

    <link
        rel="stylesheet"
        href="{% static 'accounts/css/login.css' %}?v=2"
    >

</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <!-- ============================= -->
            <!-- LADO IZQUIERDO -->
            <!-- ============================= -->

            <div class="login-form-section">

                <div class="login-logo">

                    <img
                        src="{% static 'accounts/img/addrss_logo.png' %}"
                        alt="Logo ADDRSS"
                    >

                </div>


                <div class="login-header">

                    <h1>
                        Iniciar sesión
                    </h1>

                    <p>
                        Accede a tu cuenta para continuar
                    </p>

                </div>


                <form method="POST">

                    {% csrf_token %}


                    <div class="form-group">

                        <label for="username">
                            Usuario
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Ingresa tu usuario"
                            autocomplete="username"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Ingresa tu contraseña"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn-login"
                    >
                        Ingresar
                    </button>

                </form>

            </div>


            <!-- ============================= -->
            <!-- LADO DERECHO -->
            <!-- ============================= -->

            <div class="login-image-section">

                <img
                    src="{% static 'accounts/img/login_mapa.png' %}"
                    alt="Plataforma cartográfica ADDRSS"
                >

            </div>

        </section>

    </main>

</body>

</html>
